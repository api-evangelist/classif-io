description: >-
  Classif.io publishes no billing, metering or cost-allocation surface that can be read.
  There is no invoice schema, usage endpoint, pricing catalog or cost report to map to
  FOCUS, because there is no reachable surface at all: classif.io does not resolve
  (NXDOMAIN from 8.8.8.8, 1.1.1.1 and 9.9.9.9), no NS records are published for the zone,
  and the .io registry operator's RDAP endpoint answers HTTP 404 "Object not found" for
  the domain object, so the registration has lapsed. An honest zero, recorded 2026-09-05.
note: >-
  SCAFFOLD RETIRED 2026-09-05. This file previously carried a complete invented FinOps
  posture — a Usage-Based / Monthly / USD billingModel, a five-value chargeCategories
  list, a populated FOCUS column mapping (PricingUnit "request", InvoiceIssuerName
  "Classif.io"), three metering definitions (api_requests, data_egress, compute_seconds)
  with dimension lists, and two unit-economics formulas — written by the API Evangelist
  bulk sweep dated 2026-05-04 and never harvested from or observed against the provider.
  Classif.io never published any of it. It was the same class of defect already corrected
  in plans/classif-io-plans-pricing.yml and rate-limits/classif-io-rate-limits.yml on the
  same date, and is removed here for the same reason: an unsourced scaffold reads as a
  provider-published artifact. Nothing in this file is derived from a provider document.
