description: 'Classif.io was a machine-learning classification service that offered to build a custom
  classification model from a written description of the customer''s task, publish it as a REST API, and
  let prospects try an interactive demo before buying. Its site listed sixteen such demo APIs — Fashion
  Style Classification, Custom Car Part Identification, Surgical Instrument Classification, Retail Planogram
  Compliance and others — each on its own landing page, alongside a "describe your use case" intake form.
  The homepage credited Kindwise, the team behind Plant.id, Insect.id, Mushroom ID and crop.health, as
  the maker. The service is retired: the classif.io domain is no longer registered, the last live capture
  of the site is 2025-03-21, and no developer documentation, OpenAPI definition or other machine-readable
  contract survives in any public archive. See lifecycle/classif-io-lifecycle.yml for the retirement evidence.'
